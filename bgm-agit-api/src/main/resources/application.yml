spring:
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 30
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url: jdbc:log4jdbc:mysql://${DB_URL}:${DB_PORT}/BGMAGIT
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_BUCKET}

  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS256
          jwk-set-uri: http://localhost:8080/bgm-agit/.well-known/jwks.json

  jackson:
        time-zone: Asia/Seoul
cors:
  url: http://localhost:5173
  url2: http://localhost:3000

kakao:
  redirecturi: http://localhost:5173/oauth/kakao/callback
  redirecturi2: http://localhost:3000/record/oauth/kakao/callback
  clientId: 1c41b5cad9dceea3074ad92a6d496215
  client-secret: ${CLIENT_SECRET}

naver:
  redirecturi: http://localhost:5173/oauth/naver/callback
  redirecturi2: http://localhost:3000/record/oauth/naver/callback
  clientId: PsFKP7NZFE16cvAOX80d
  client-secret: ${NAVER_CLIENT_SECRET}




cookie:
  secure: false

biztalk:
  id: ${BIZTALK_ID}
  password: ${BIZTALK_PASSWORD}
  sender-key: ${SENDER_KEY}
  # 로컬은 관리자 당일 예약 알림톡 미발송.
  admin-reservation-notify: false
  # 로컬은 계좌안내 템플릿 유지. 결제안내 문구를 확인하려면 true.
  reservation-payment-live: false

server:
  tomcat:
    max-part-count: 2000

kml:
  url: https://kml.or.kr/stat52
  api:
    key: ${KML_API_KEY}

# 로컬 .env 의 TOSS_* 는 반드시 테스트 키(test_gck_/test_gsk_). 같은 이름을 운영 GitHub Secrets 가 라이브 키로 쓴다.
toss:
  client-key: ${TOSS_CLIENT_KEY}
  secret-key: ${TOSS_SECRET_KEY}
  confirm-url: https://api.tosspayments.com/v1/payments/confirm
  cancel-url: https://api.tosspayments.com/v1/payments

# false 면 결제 성공해도 예약 자동확정/확정 알림톡이 발동하지 않는다(심사 기간용). 심사 통과로 true.
payment:
  live: true