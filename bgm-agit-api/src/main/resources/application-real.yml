spring:
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        default_batch_fetch_size: 30
  datasource:
    driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    url:  jdbc:log4jdbc:mysql://${DB_URL}:${DB_PORT}/BGMAGIT
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${AWS_BUCKET}

  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: RS256
          jwk-set-uri: https://bgmagit.co.kr/bgm-agit/.well-known/jwks.json


logging:
  file:
    name: /app/logs/bgmagit.log
    level:
      root: INFO
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE}.%d{yyyy-MM-dd}.%i.log


cors:
  url: https://bgmagit.co.kr
  url2:

kakao:
  redirecturi: https://bgmagit.co.kr/oauth/kakao/callback
  redirecturi2: https://bgmagit.co.kr/record/oauth/kakao/callback
  clientId: 1c41b5cad9dceea3074ad92a6d496215
  client-secret: ${CLIENT_SECRET}

naver:
  redirecturi: https://bgmagit.co.kr/oauth/naver/callback
  redirecturi2: https://bgmagit.co.kr/record/oauth/naver/callback
  clientId: PsFKP7NZFE16cvAOX80d
  client-secret: ${NAVER_CLIENT_SECRET}



cookie:
  secure: true

biztalk:
  id: ${BIZTALK_ID}
  password: ${BIZTALK_PASSWORD}
  sender-key: ${SENDER_KEY}
  # 관리자 당일 예약 알림톡을 실제로 보내는 환경. 운영만 true(staging 과 동시 발송 방지).
  admin-reservation-notify: true
  # 예약 대기 알림톡을 계좌안내(bgmagit-res-account2) 대신 예약금 결제안내(bgmagit-res-payment-1)로 발송.
  # 토스 가맹점 심사 통과 + 카카오 템플릿 검수 통과로 켰다. 되돌리려면 false 로만 바꾸면 된다.
  reservation-payment-live: true

server:
  tomcat:
    max-part-count: 2000

kml:
  url: https://kml.or.kr/stat52
  api:
    key: ${KML_API_KEY}


# 운영은 라이브 키(live_gck_/live_gsk_). staging 과 시크릿을 공유하면 스테이징 테스트가 실제 결제가 된다.
toss:
  client-key: ${TOSS_CLIENT_KEY}
  secret-key: ${TOSS_SECRET_KEY}
  confirm-url: https://api.tosspayments.com/v1/payments/confirm
  cancel-url: https://api.tosspayments.com/v1/payments

payment:
  live: true
